### robot_localization EKF - local (odom) instance ###
# Fuses hex_gazebo's ground-truth /odom (gz-sim OdometryPublisher, real simulated pose/
# twist - see hex.gazebo.xacro) with /imu (real simulated IMU). This is the ONLY node
# that publishes the odom -> base_footprint TF edge; hex_gazebo's OdometryPublisher does
# not publish TF (see comment there), so there is exactly one authority for this edge.
ekf_filter_node:
  ros__parameters:
    frequency: 50.0
    two_d_mode: true
    publish_tf: true
    map_frame: map
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    use_sim_time: true

    odom0: odom
    odom0_config: [true,  true,  false,
                   false, false, true,
                   true,  true,  false,
                   false, false, true,
                   false, false, false]
    odom0_differential: false
    odom0_relative: false
    odom0_queue_size: 10

    imu0: imu
    imu0_config: [false, false, false,
                  false, false, true,
                  false, false, false,
                  false, false, true,
                  false, false, false]
    imu0_differential: false
    imu0_relative: false
    imu0_remove_gravitational_acceleration: true
    imu0_queue_size: 10
